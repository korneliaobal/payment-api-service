spring.application.name=payment-api-service\
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

spring.kafka.properties.schema.registry.url=http://localhost:8081

spring.kafka.consumer.group-id=payment-orchestrator
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true

spring.datasource.url=jdbc:postgresql://localhost:5432/payment_processing
spring.datasource.username=payment_user
spring.datasource.password=payment_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true